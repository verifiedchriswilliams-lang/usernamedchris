<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
:root{--warm:#F3D9A6;--red:#FF4A3D;--blue:#3B5BFF;--font:Inter,system-ui,-apple-system,sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;color:#fff;font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;touch-action:manipulation}
.stage{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 110%,#1a1512 0,#000 60%)}
/* the device: the rendered radio. On phones it fills the width; on larger screens it fills the height */
.device{position:relative;width:min(100vw,calc(100vh * 1080 / 1918),560px);aspect-ratio:1080/1918;background:#000}
@media (max-width:600px){.device{width:100vw}}
.device>img.art{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;user-select:none;-webkit-user-drag:none}
/* intro video sits on top of everything until it ends */
.intro{position:absolute;inset:0;z-index:5;background:#000;transition:opacity .9s ease}
.intro video{width:100%;height:100%;object-fit:cover;display:block}
.intro.done{opacity:0;pointer-events:none}
/* the tap target sits exactly on the rendered play button in the first frame */
.introtap{position:absolute;left:40.19%;top:83.26%;width:19.26%;aspect-ratio:1;border-radius:50%;border:0;padding:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;box-shadow:0 0 0 0 rgba(243,217,166,0);animation:invite 2.4s ease-in-out infinite;transition:opacity .3s}
.introtap.gone{opacity:0;pointer-events:none;animation:none}
/* the first frame sits over the video as an image, so there is no poster swap and no flash when playback begins */
.intro .still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;transition:opacity .25s linear}
.intro .still.gone{opacity:0}
.intro .hint.tap{bottom:3.2%;color:rgba(243,217,166,.75);transition:opacity .3s}
.intro .hint.tap.gone{opacity:0}
@keyframes invite{0%,100%{box-shadow:0 0 0 0 rgba(243,217,166,.0)}50%{box-shadow:0 0 0 6px rgba(243,217,166,.22),0 0 30px rgba(243,217,166,.35)}}
/* UI layer, hidden until the intro is over */
.ui{position:absolute;inset:0;z-index:3;opacity:0;transition:opacity .8s ease .2s}
.ui.on{opacity:1}
/* glyph glow: pulses while playing, dims when stopped */
/* the glyph glow: two color pools that slowly drift in hue and swell with the low end of whatever is playing */
.glow{position:absolute;left:22%;top:40%;width:52%;height:36%;pointer-events:none;border-radius:50%;--h1:4;--h2:232;--beat:0;--amb:.55;
  background:radial-gradient(40% 55% at 31% 50%,hsla(var(--h1),100%,62%,.65),transparent 70%),radial-gradient(40% 55% at 69% 50%,hsla(var(--h2),100%,64%,.65),transparent 70%);
  filter:blur(26px);mix-blend-mode:screen;opacity:0;transition:opacity 1.2s ease;
  transform:scale(calc(.96 + var(--beat) * .12))}
.playing .glow{opacity:calc(var(--amb) + var(--beat) * .5)}
/* a tighter, brighter core that only shows on hits */
.core{position:absolute;left:30%;top:46%;width:36%;height:24%;pointer-events:none;border-radius:50%;--beat:0;--h1:4;--h2:232;
  background:radial-gradient(30% 50% at 34% 50%,hsla(var(--h1),100%,80%,.9),transparent 70%),radial-gradient(30% 50% at 66% 50%,hsla(var(--h2),100%,82%,.9),transparent 70%);
  filter:blur(14px);mix-blend-mode:screen;opacity:0;transform:scale(calc(.9 + var(--beat) * .25))}
.playing .core{opacity:calc(var(--beat) * .9)}
.oncall .core{opacity:0}
.off{position:absolute;left:20%;top:39%;width:56%;height:38%;pointer-events:none;background:rgba(0,0,0,.0);transition:background 1.2s ease}
.idle .off{background:rgba(0,0,0,.35)}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(.97)}50%{opacity:1;transform:scale(1.03)}}
/* the tuning window becomes the now-playing pane */
.pane{position:absolute;left:8%;top:14.2%;width:84%;height:14.3%;display:flex;align-items:center;gap:calc(var(--ph,100px)*.14);padding:0 calc(var(--ph,100px)*.12);color:#F2EEE8;overflow:hidden;border-radius:6px;
  background:radial-gradient(120% 140% at 50% 0%,#17171a 0,#09090a 60%,#050506 100%);box-shadow:inset 0 2px 10px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.05)}
.pane:before{content:"";position:absolute;left:50%;top:7%;width:3.2%;height:6%;margin-left:-1.6%;border-radius:2px;background:#ff2a1f;box-shadow:0 0 10px #ff3a2a,0 0 22px rgba(255,60,40,.6);animation:led 3.2s ease-in-out infinite}
.idle .pane:before{animation-duration:5s}
@keyframes led{0%,100%{opacity:.55;box-shadow:0 0 6px #ff3a2a,0 0 14px rgba(255,60,40,.35)}50%{opacity:1;box-shadow:0 0 12px #ff3a2a,0 0 30px rgba(255,60,40,.75),0 0 60px rgba(255,60,40,.35)}}
/* the LED's reflection on the chrome bezel above the pane */
.ledwash{position:absolute;left:38%;top:9.5%;width:24%;height:8%;pointer-events:none;mix-blend-mode:screen;filter:blur(10px);background:radial-gradient(50% 70% at 50% 100%,rgba(255,70,50,.75),rgba(255,70,50,.2) 50%,transparent 75%);animation:ledwash 3.2s ease-in-out infinite}
.idle .ledwash{animation-duration:5s}
@keyframes ledwash{0%,100%{opacity:.35}50%{opacity:1}}
.pane:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.07),transparent 35%);pointer-events:none}
.pane .cover{flex:0 0 auto;width:calc(var(--ph,100px)*.7);height:calc(var(--ph,100px)*.7);border-radius:12%;background:#111 center/cover no-repeat;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 6px 18px rgba(0,0,0,.6);display:grid;place-items:center;overflow:hidden}
.pane .cover.fallback:before{content:"";width:46%;height:60%;border-left:6px solid var(--red);border-right:6px solid var(--blue);box-sizing:border-box;filter:drop-shadow(0 0 8px rgba(255,120,100,.8))}
.pane .txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:calc(var(--ph,100px)*.02);line-height:1.2;padding-top:calc(var(--ph,100px)*.06)}
.pane .st{font-family:var(--mono);font-size:clamp(8px,calc(var(--ph,100px)*.1),12px);letter-spacing:.14em;text-transform:uppercase;color:var(--warm);opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pane .ti{font-weight:700;text-overflow:ellipsis;font-size:clamp(12px,calc(var(--ph,100px)*.17),20px);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pane .ar{font-size:clamp(10px,calc(var(--ph,100px)*.13),15px);color:rgba(242,238,232,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* request line: ringing handset in a thin ring, label stacked beneath, no box */
.req{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:calc(var(--ph,100px)*.05);padding:0 0 0 calc(var(--ph,100px)*.04);border:0;background:none;color:var(--warm);font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.req .c{position:relative;width:calc(var(--ph,100px)*.38);height:calc(var(--ph,100px)*.38);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#2a2724,#0b0a09 70%);box-shadow:0 0 0 1px rgba(243,217,166,.5),inset 0 1px 0 rgba(255,255,255,.12);transition:box-shadow .2s,transform .12s}
.req:hover .c,.req:focus-visible .c{box-shadow:0 0 0 1px rgba(243,217,166,.9),0 0 14px rgba(243,217,166,.35),inset 0 1px 0 rgba(255,255,255,.12)}
.req:active .c{transform:scale(.95)}
.req:focus-visible{outline:none}
.req svg{width:52%;height:52%;fill:none;stroke:var(--warm);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px rgba(243,217,166,.5))}
.req span{font-family:var(--mono);font-size:clamp(6px,calc(var(--ph,100px)*.075),9px);letter-spacing:.14em;text-transform:uppercase;line-height:1.2;text-align:center;opacity:.85}
/* the 11 glyph beside the station name */
.pane .st{display:flex;align-items:center;gap:.45em}
.pane .st i{display:inline-block;width:.55em;height:.85em;border-left:.22em solid var(--warm);border-right:.22em solid var(--warm);box-sizing:border-box;filter:drop-shadow(0 0 3px rgba(243,217,166,.7))}
/* long titles: sit for 3 seconds, then crawl */
.pane .ti{position:relative;overflow:hidden}
.pane .ti span{display:inline;white-space:nowrap;will-change:transform}
.pane .ti.crawl{text-overflow:clip;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.pane .ti.crawl span{display:inline-block;padding-right:.4em}

@keyframes blink{50%{opacity:.25}}
/* call mode: the pane flips from now-playing to the line with Kip */
.pane .np{display:contents}
.pane .call{display:none;flex:1;min-width:0;align-items:center;gap:calc(var(--ph,100px)*.12)}
.oncall .pane .np{display:none}
.oncall .pane .call{display:flex}
.call .orb{flex:0 0 auto;width:calc(var(--ph,100px)*.7);height:calc(var(--ph,100px)*.7);border-radius:50%;position:relative;background:radial-gradient(circle at 50% 40%,#2a2724,#0b0a09 70%);box-shadow:0 0 0 1px rgba(243,217,166,.45),inset 0 1px 0 rgba(255,255,255,.12);display:grid;place-items:center}
.call .orb:before{content:"";position:absolute;inset:-6%;border-radius:50%;border:2px solid rgba(243,217,166,.6);opacity:0;transform:scale(1)}
.call .orb.speaking:before{animation:ring 1.4s ease-out infinite}
.call .orb.listening{box-shadow:0 0 0 1px rgba(243,217,166,.9),0 0 14px rgba(243,217,166,.35),inset 0 1px 0 rgba(255,255,255,.12)}
@keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}
.call .orb i{display:block;width:40%;height:52%;border-left:.22em solid var(--warm);border-right:.22em solid var(--warm);box-sizing:border-box;filter:drop-shadow(0 0 4px rgba(243,217,166,.7))}
.call .ctxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:calc(var(--ph,100px)*.03)}
.call .who{font-weight:700;font-size:clamp(12px,calc(var(--ph,100px)*.17),20px);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.call .how{font-family:var(--mono);font-size:clamp(8px,calc(var(--ph,100px)*.1),12px);letter-spacing:.12em;text-transform:uppercase;color:var(--warm);opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.call .lvl{height:3px;width:60%;max-width:140px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:calc(var(--ph,100px)*.02)}
.call .lvl b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--blue));transition:width .12s}
.call .end{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:calc(var(--ph,100px)*.05);border:0;background:none;color:#ff6b5e;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.call .end .c{width:calc(var(--ph,100px)*.38);height:calc(var(--ph,100px)*.38);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#3a1612,#120605 70%);box-shadow:0 0 0 1px rgba(255,107,94,.6),inset 0 1px 0 rgba(255,255,255,.1)}
.call .end svg{width:52%;height:52%;fill:none;stroke:#ff6b5e;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transform:rotate(135deg)}
.call .end span{font-family:var(--mono);font-size:clamp(6px,calc(var(--ph,100px)*.075),9px);letter-spacing:.14em;text-transform:uppercase;line-height:1.2;opacity:.9}
/* while on the line with Kip, the glyph breathes white instead of red/blue */
.oncall .glow{opacity:1;animation:breathe 2.2s ease-in-out infinite;transform:none;background:radial-gradient(45% 60% at 50% 50%,rgba(243,217,166,.6),transparent 70%)}
.oncall .off{background:rgba(0,0,0,.0)}
/* progress hairline under the pane text */
.bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.08)}
.bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--blue));transition:width 1s linear}
/* play button: sits exactly on the rendered button */
.play{position:absolute;left:40.19%;top:83.26%;width:19.26%;aspect-ratio:1;border-radius:50%;border:0;padding:0;cursor:pointer;background:transparent;-webkit-tap-highlight-color:transparent;transition:transform .12s}
.play:active{transform:scale(.97)}
.play:focus-visible{outline:2px solid var(--warm);outline-offset:4px}
.play img{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .35s;pointer-events:none;-webkit-user-drag:none}
.playing .play img{opacity:1}
/* volume knob: invisible hit area with a glowing indicator that rotates */
.knob{position:absolute;left:71.11%;top:33.42%;width:22.04%;aspect-ratio:1;border-radius:50%;cursor:grab;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none}
.knob:active{cursor:grabbing}
.knob:before{content:"";position:absolute;inset:3%;border-radius:50%;background:#141210}
.knob img{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:50%;transform:rotate(var(--deg,0deg));transition:transform .06s linear;pointer-events:none;-webkit-user-drag:none}
.knob:focus-visible{outline:2px solid var(--warm);outline-offset:4px}
/* tiny top chrome */
.top{position:fixed;left:0;right:0;top:0;z-index:6;display:flex;justify-content:space-between;align-items:center;padding:max(14px,env(safe-area-inset-top)) 18px 0;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.top a{color:inherit;text-decoration:none}
.top a:hover{color:#fff}
@media (max-width:600px){.top{display:none}}
.hint{position:absolute;left:0;right:0;bottom:3.2%;text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.4);pointer-events:none;transition:opacity .6s}
.playing .hint{opacity:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.glow,.pane:before,.ledwash,.pane .ti.crawl span{animation:none}.glow,.core{transform:none!important}}
</style>

<div class="top"><a href="/">← usernamedchris.com</a><span>ElevenRadio · Live</span></div>
<div class="stage">

      <button class="introtap" id="introTap" type="button" aria-label="Power on ElevenRadio"></button>
      <div class="hint tap" id="tapHint">Tap play</div>

  </div>
</div>
<audio id="audio" preload="none" playsinline crossorigin="anonymous" disableremoteplayback x-webkit-airplay="deny"></audio>

<script>
// ===== config =====
const STREAM = 'https://shflab.superhifi.radio/halloween/playlist.m3u8'; // swap for the ElevenRadio master playlist when it arrives
const STATION = 'ElevenRadio';
const TAGLINE = 'Different Here';
const INTRO_EVERY_VISIT = true;
const KIP_AGENT_ID = 'agent_4201m4511hnzebhrexm3pjhq48fc'; // Kip: Keep It Playing

// ===== elements =====
const body=document.body, audio=document.getElementById('audio'), ui=document.getElementById('ui'), intro=document.getElementById('intro'), vid=document.getElementById('introVid');
const $=id=>document.getElementById(id);
const el={cover:$('cover'),st:$('st'),ti:$('ti'),tiWrap:$('tiWrap'),ar:$('ar'),bar:$('bar'),play:$('play'),knob:$('knob'),req:$('req')};

// pane height drives the type and art sizes inside it (works the same in Safari and Chrome)
const pane=$('pane'); const sizePane=()=>pane.style.setProperty('--ph',pane.clientHeight+'px'); sizePane(); addEventListener('resize',sizePane); new ResizeObserver(sizePane).observe(pane);
// ===== intro =====
function endIntro(){ intro.classList.add('done'); ui.classList.add('on'); }
// One tap does everything: the page opens on the intro's first frame (play button lit). Tapping the radio's
// play button starts the intro with sound, unlocks the stream, and when the intro ends the station starts.
let attached=false;
(function(){
  const seen = sessionStorage.getItem('er-intro');
  if(!INTRO_EVERY_VISIT && seen){ endIntro(); return; }
  const tap=document.getElementById('introTap');
  let failsafe=null;
  vid.addEventListener('ended',()=>{ sessionStorage.setItem('er-intro','1'); endIntro(); play(); });
  vid.addEventListener('error',()=>{ endIntro(); play(); });
  const still=document.getElementById('still'), hint=document.getElementById('tapHint');
  const reveal=()=>{ still.classList.add('gone'); hint.classList.add('gone'); };
  vid.addEventListener('timeupdate',function tu(){ if(vid.currentTime>0.04){ reveal(); vid.removeEventListener('timeupdate',tu); } });
  vid.addEventListener('playing',()=>{ tap.classList.add('gone'); clearTimeout(failsafe); failsafe=setTimeout(()=>{ if(!intro.classList.contains('done')){ endIntro(); play(); } },9000); });
  tap.addEventListener('click',()=>{
    vid.muted=false; vid.volume=1; vid.play().catch(()=>{ endIntro(); play(); });
    ensureGraph(); resumeGraph();
    // use this same tap to unlock the stream element so the station can start by itself after the intro
    attach().then(()=>{ attached=true; const p=audio.play(); if(p&&p.then) p.then(()=>audio.pause()).catch(()=>{}); }).catch(()=>{});
  });
})();

// ===== playback: native HLS on Safari/iOS, hls.js elsewhere =====
// Safari's native HLS bypasses Web Audio (no volume, no duck, no glyph), so prefer hls.js wherever it runs,
// including iOS 17.1+ via Managed Media Source. Native HLS is the fallback for older iPhones.
let isNative = false; let graphLive=false;
// iOS ignores audio.volume, so on iOS the stream runs through a Web Audio gain node, which it does honor
const iOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let actx=null, gain=null, analyser=null, fft=null;
function ensureGraph(){ if(gain) return; try{ actx=new (window.AudioContext||window.webkitAudioContext)(); const src=actx.createMediaElementSource(audio); gain=actx.createGain(); gain.gain.value=1; analyser=actx.createAnalyser(); analyser.fftSize=512; analyser.smoothingTimeConstant=.82; fft=new Uint8Array(analyser.frequencyBinCount); src.connect(gain); gain.connect(analyser); analyser.connect(actx.destination); startViz(); }catch(e){ console.warn('web audio',e); } }
// ===== the glyph reacts to the music =====
const glowEl=document.getElementById('glow'), coreEl=document.getElementById('core');
let vizOn=false, beat=0, floor=0.15, heard=0, silentFrames=0;
function startViz(){ if(vizOn) return; vizOn=true; let last=performance.now();
  (function frame(now){ if(!vizOn) return; requestAnimationFrame(frame); const dt=Math.min(.05,(now-last)/1000); last=now;
    // low end: bins ~1..8 cover roughly 40 to 350 Hz at 44.1k/512
    let target=0;
    if(analyser && !audio.paused && !document.hidden){ analyser.getByteFrequencyData(fft); let sum=0; for(let i=1;i<9;i++) sum+=fft[i]; const bass=sum/8/255; if(sum>0){ heard++; graphLive=true; silentFrames=0; } else if(audio.currentTime>3) silentFrames++;
      // adaptive floor so quiet songs still breathe and loud songs don't peg
      floor+= (bass-floor)*dt*.4; target=Math.max(0,Math.min(1,(bass-floor)*3.2)); }
    beat += (target-beat)*(target>beat? .55 : dt*6);   // fast attack, slow release
    // slow hue drift: warm pool wanders red to orange to pink, cool pool blue to violet to teal, each on its own clock
    const t=now/1000; const h1=4+Math.sin(t/23)*18+Math.sin(t/7.3)*6; const h2=232+Math.sin(t/31+1)*34+Math.sin(t/9.1)*8;
    for(const el of [glowEl,coreEl]){ el.style.setProperty('--beat',beat.toFixed(3)); el.style.setProperty('--h1',h1.toFixed(1)); el.style.setProperty('--h2',h2.toFixed(1)); }
  })(last); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) resumeGraph(); });
function resumeGraph(){ if(actx&&actx.state!=='running') actx.resume().catch(()=>{}); }
audio.addEventListener('play',()=>{ ensureGraph(); resumeGraph(); });
function setLevel(v,ramp){ if(gain){ const t=actx.currentTime; gain.gain.cancelScheduledValues(t); gain.gain.setValueAtTime(gain.gain.value,t); gain.gain.linearRampToValueAtTime(v,t+(ramp||0)); } else { try{ audio.volume=v; }catch(e){} } }
let hls=null, hlsReady=false;
function useNative(){ isNative=true; audio.src=STREAM; }
function attach(){
  return new Promise((res)=>{
    const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js';
    s.onerror=()=>{ useNative(); res(); };
    s.onload=()=>{ if(!Hls.isSupported()){ useNative(); res(); return; }
      hls=new Hls({liveSyncDuration:12,enableWorker:true}); hls.loadSource(STREAM); hls.attachMedia(audio);
      hls.on(Hls.Events.ERROR,(e,d)=>{ if(d.fatal){ console.warn('hls fatal, going native',d.type); try{ hls.destroy(); }catch(x){} hls=null; useNative(); audio.play().catch(()=>{}); } });
      hls.on(Hls.Events.FRAG_CHANGED,(e,d)=>{ if(d.frag&&d.frag.title) applyMeta(parseMeta(d.frag.title)); });
      hlsReady=true; res(); };
    document.head.appendChild(s);
  });
}
async function play(){
  if(!attached){ await attach(); attached=true; }
  ensureGraph(); resumeGraph();
  try{ await audio.play(); }catch(e){ console.warn(e); }
}
function pause(){ audio.pause(); }
el.play.addEventListener('click',()=>{ audio.paused?play():pause(); });
audio.addEventListener('playing',()=>{ body.classList.replace('idle','playing'); el.play.setAttribute('aria-label','Pause'); });
audio.addEventListener('pause',()=>{ body.classList.replace('playing','idle'); el.play.setAttribute('aria-label','Play'); });

// ===== metadata: Super Hi-Fi writes a JSON blob on every #EXTINF line =====
function parseMeta(title){ try{ return JSON.parse(title); }catch(e){ return null; } }
let current=null;
function applyMeta(m){
  if(!m||!m.current) return;
  const c=m.current;
  if(current && current.id===c.id){ tick(c); return; }
  current=c;
  el.st.textContent=STATION; el.ti.textContent=c.title||TAGLINE; el.ar.textContent=c.artist||''; fitTitle();
  if(c.image){ const im=new Image(); im.onload=()=>{ el.cover.style.backgroundImage=`url("${c.image}")`; el.cover.classList.remove('fallback'); }; im.onerror=()=>{ el.cover.style.backgroundImage=''; el.cover.classList.add('fallback'); }; im.src=c.image; }
  else { el.cover.style.backgroundImage=''; el.cover.classList.add('fallback'); }
  $('srNow').textContent=`Now playing ${c.title} by ${c.artist}`;
  document.title=`${c.title} · ${c.artist} · ${STATION}`;
  if('mediaSession' in navigator && !callActive){
    navigator.mediaSession.metadata=new MediaMetadata({title:c.title||STATION,artist:c.artist||'',album:STATION,artwork:c.image?[{src:c.image,sizes:'512x512',type:'image/jpeg'}]:[]});
  }
  tick(c);
}
function tick(c){
  if(c.duration&&c.elapsed_ms!=null){ const p=Math.min(100,(c.elapsed_ms/1000/c.duration)*100); el.bar.style.width=p+'%'; }
}
// Safari path: poll the media playlist and pick the segment that matches what is actually playing (via PROGRAM-DATE-TIME)
let variantUrl=null, pollTimer=null;
async function resolveVariant(){
  const t=await (await fetch(STREAM,{cache:'no-store'})).text();
  const line=t.split('\n').map(l=>l.trim()).find(l=>l&&!l.startsWith('#'));
  if(!line) return STREAM;
  return new URL(line,STREAM).href;
}
function parsePlaylist(t){
  const segs=[]; let pdt=null; let dur=0;
  for(const raw of t.split('\n')){ const l=raw.trim();
    if(l.startsWith('#EXT-X-PROGRAM-DATE-TIME:')) pdt=new Date(l.slice(25)).getTime();
    else if(l.startsWith('#EXTINF:')){ const i=l.indexOf(','); dur=parseFloat(l.slice(8,i)); const title=l.slice(i+1); segs.push({pdt,dur,meta:parseMeta(title)}); if(pdt!=null) pdt+=dur*1000; }
  }
  return segs;
}
async function poll(){
  try{
    if(!variantUrl) variantUrl=await resolveVariant();
    const segs=parsePlaylist(await (await fetch(variantUrl,{cache:'no-store'})).text());
    if(!segs.length) return;
    let pick=segs[segs.length-1];
    // where is the listener, in wall-clock time?
    let pos=null;
    if(isNative && typeof audio.getStartDate==='function'){ const sd=audio.getStartDate(); if(sd && !isNaN(sd)) pos=sd.getTime()+audio.currentTime*1000; }
    if(pos==null && hls && hls.playingDate) pos=hls.playingDate.getTime();
    if(pos!=null){ for(const s of segs){ if(s.pdt!=null && s.pdt<=pos) pick=s; } }
    if(pick.meta) applyMeta(pick.meta);
  }catch(e){ console.warn('meta',e); }
}
function startPolling(){ if(pollTimer) return; poll(); pollTimer=setInterval(poll,5000); }
audio.addEventListener('play',startPolling);
// show what's on even before the first tap
poll();

// title crawl: if it overflows, hold 3s, scroll to the end, hold, snap back
let crawlTimer=null, crawlGen=0;
function fitTitle(){ const w=el.tiWrap, t=el.ti; const gen=++crawlGen; clearTimeout(crawlTimer); t.style.transition='none'; t.style.transform='';
  requestAnimationFrame(()=>{ w.classList.add('crawl'); const over=t.scrollWidth-w.clientWidth; w.classList.remove('crawl'); if(over<=4) return;
    const dist=over+8, secs=dist/28;
    const go=()=>{ if(gen!==crawlGen) return; w.classList.add('crawl'); requestAnimationFrame(()=>{ t.style.transition=`transform ${secs}s linear`; t.style.transform=`translateX(${-dist}px)`; });
      crawlTimer=setTimeout(()=>{ if(gen!==crawlGen) return; t.style.transition='none'; t.style.transform=''; w.classList.remove('crawl'); crawlTimer=setTimeout(go,3000); }, secs*1000+1500); };
    crawlTimer=setTimeout(go,3000); }); }
addEventListener('resize',fitTitle);
// request line: placeholder until the Kip agent is wired in
// ===== Request line: a live call with Kip, inside the pane =====
let convo=null, callActive=false, wasPlaying=false, lvlTimer=null;
const how=$('how'), orb=$('orb'), lvl=$('lvl');
function loadSdk(){ return window.ElevenLabsClient?Promise.resolve():new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src='https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.32.0/dist/lib.iife.js'; sc.onload=res; sc.onerror=rej; document.head.appendChild(sc); }); }
// The handoff is staged like a real phone call interrupting the radio. On phones the OS re-routes audio the
// moment the mic opens, so the station must be silent and stopped BEFORE that happens, and restarted only after
// the mic is released. Desktop keeps a quiet bed under the call since it has no audio-session switch.
const mobile=/Android|iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const CALL_BED = mobile ? 0 : 0.18;
let wasPlayingForCall=false;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function fadeTo(level,secs){ ensureGraph(); resumeGraph(); setLevel(level,secs); await wait(secs*1000+40); }
async function stationOut(){
  wasPlayingForCall=!audio.paused;
  if(!wasPlayingForCall) return;
  if(graphLive||!isNative) await fadeTo(CALL_BED,.6);
  if(CALL_BED===0 || (!graphLive&&isNative)){ audio.pause(); if(hls) hls.stopLoad(); }
}
async function stationBack(){
  if(!wasPlayingForCall) return;
  if(audio.paused){ setLevel(0,0); if(hls) hls.startLoad(-1); await play(); await wait(250); }
  await fadeTo(vol,1.2);
}
function setHow(t,cls){ how.textContent=t; orb.className='orb'+(cls?' '+cls:''); }
async function startCall(){
  if(callActive) return; callActive=true; body.classList.add('oncall'); setHow('Connecting');
  try{
    const sdk=loadSdk();
    await stationOut();           // 1. radio down and stopped, in silence
    await wait(120);              // 2. let the output route settle
    await sdk;
    const mic=await navigator.mediaDevices.getUserMedia({audio:true});   // 3. now take the mic
    mic.getTracks().forEach(t=>t.stop());                                // the SDK opens its own; this was just the permission
    if(!callActive) return;
    convo=await ElevenLabsClient.Conversation.startSession({             // 4. connect
      agentId:KIP_AGENT_ID, connectionType:'websocket',
      onConnect:()=>{ setHow('On the line','listening'); lvlTimer=setInterval(()=>{ try{ const v=convo.getOutputVolume?convo.getOutputVolume():0; const u=convo.getInputVolume?convo.getInputVolume():0; lvl.style.width=Math.round(Math.max(v,u)*100)+'%'; }catch(e){} },100); },
      onModeChange:m=>{ setHow(m.mode==='speaking'?'Kip is talking':'Listening', m.mode==='speaking'?'speaking':'listening'); },
      onDisconnect:()=>endCall(true),
      onError:(msg)=>{ console.warn('kip',msg); setHow('Line dropped'); setTimeout(()=>endCall(true),1200); },
    });
    if('mediaSession' in navigator) navigator.mediaSession.metadata=new MediaMetadata({title:'On the line with Kip',artist:STATION,album:STATION});
  }catch(e){ console.warn('call failed',e); setHow(/NotAllowed|Permission/i.test(String(e))?'Mic blocked':'Could not connect'); setTimeout(()=>endCall(true),1600); }
}
let ending=false;
async function endCall(fromRemote){
  if(!callActive||ending) return; ending=true; callActive=false; clearInterval(lvlTimer); lvl.style.width='0';
  setHow('Hanging up');
  try{ if(convo && !fromRemote) await convo.endSession(); }catch(e){} convo=null;   // 1. drop the line, release the mic
  await wait(mobile?450:150);                                                        // 2. let the route switch back
  body.classList.remove('oncall');
  if(current) applyMeta({current}); else if('mediaSession' in navigator) navigator.mediaSession.metadata=new MediaMetadata({title:TAGLINE,artist:STATION,album:STATION});
  await stationBack();                                                               // 3. radio back, fading up
  ending=false;
}
el.req.addEventListener('click',startCall);
$('endCall').addEventListener('click',()=>endCall(false));
addEventListener('pagehide',()=>{ if(convo) convo.endSession().catch(()=>{}); });
// ===== diagnostics: add ?debug=1 to the URL =====
if(/[?&]debug=1/.test(location.search)){ const d=document.createElement('pre'); d.style.cssText='position:fixed;left:8px;bottom:8px;z-index:99;margin:0;padding:8px 10px;background:rgba(0,0,0,.75);color:#9f9;font:11px/1.4 monospace;border-radius:8px;pointer-events:none;white-space:pre-wrap;max-width:60vw'; document.body.appendChild(d);
  setInterval(()=>{ let sum=0; if(analyser){ analyser.getByteFrequencyData(fft); for(let i=0;i<fft.length;i++) sum+=fft[i]; }
    d.textContent=`path: ${hls?'hls.js':(isNative?'native HLS':'none')}\nMMS: ${'ManagedMediaSource' in window} MSE: ${'MediaSource' in window}\nhls.isSupported: ${window.Hls?Hls.isSupported():'(not loaded)'}\nctx: ${actx?actx.state:'none'} gain: ${gain?gain.gain.value.toFixed(2):'none'}\nanalyser energy: ${sum}\nplaying: ${!audio.paused} t=${audio.currentTime.toFixed(1)} vol=${vol.toFixed(2)}\nerr: ${window._lastErr||''}`; },500);
  addEventListener('error',e=>{ window._lastErr=e.message; }); const w=console.warn; console.warn=(...a)=>{ window._lastErr=a.map(String).join(' ').slice(0,120); w(...a); }; }
// ===== media session controls (lock screen / Dynamic Island) =====
if('mediaSession' in navigator){
  navigator.mediaSession.setActionHandler('play',play);
  navigator.mediaSession.setActionHandler('pause',pause);
  navigator.mediaSession.metadata=new MediaMetadata({title:TAGLINE,artist:STATION,album:STATION,artwork:[{src:location.origin+'/media/elevenradio-radio.jpg',sizes:'1080x1918',type:'image/jpeg'}]});
}

// ===== volume knob (iOS ignores software volume, so it hides there) =====
// the rendered indicator points straight up, which we call 50%: the disc turns -135° (silent) to +135° (full)
let vol=0.5; const setVol=v=>{ vol=Math.max(0,Math.min(1,v)); if(!callActive) setLevel(vol,0); el.knob.style.setProperty('--deg',(-135+vol*270)+'deg'); el.knob.setAttribute('aria-valuenow',Math.round(vol*100)); };
setVol(vol);
let drag=null;
const angleAt=e=>{ const r=el.knob.getBoundingClientRect(); return Math.atan2(e.clientY-(r.top+r.height/2), e.clientX-(r.left+r.width/2))*180/Math.PI; };
el.knob.addEventListener('pointerdown',e=>{ e.preventDefault(); drag={a:angleAt(e),v:vol}; el.knob.setPointerCapture(e.pointerId); });
el.knob.addEventListener('pointermove',e=>{ if(!drag) return; let d=angleAt(e)-drag.a; while(d>180) d-=360; while(d<-180) d+=360; const nv=drag.v+d/270; setVol(nv); if(nv<=0||nv>=1){ drag.a=angleAt(e); drag.v=vol; } });
el.knob.addEventListener('pointerup',()=>drag=null); el.knob.addEventListener('pointercancel',()=>drag=null);
el.knob.addEventListener('wheel',e=>{ e.preventDefault(); setVol(vol-Math.sign(e.deltaY)*0.05); },{passive:false});
el.knob.addEventListener('keydown',e=>{ if(e.key==='ArrowUp'||e.key==='ArrowRight'){setVol(vol+0.05);e.preventDefault();} if(e.key==='ArrowDown'||e.key==='ArrowLeft'){setVol(vol-0.05);e.preventDefault();} });
// space bar toggles
addEventListener('keydown',e=>{ if(e.code==='Space'&&document.activeElement.tagName!=='BUTTON'){ e.preventDefault(); audio.paused?play():pause(); } });
</script>
</body>
